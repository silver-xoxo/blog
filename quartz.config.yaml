# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "silver-xoxo"
  pageTitleSuffix: " | silversec.in"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: silversec.in
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: JetBrains Mono
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f6f2e9"                      # Warm Soft Paper background
        lightgray: "#e4decb"                  # Subtle warm paper borders & code blocks
        gray: "#7c7567"                       # Warm muted ink for metadata & graph edges
        darkgray: "#2c2a26"                   # Crisp warm charcoal ink for body text
        dark: "#141311"                       # Deep espresso ink for headings
        secondary: "#0969da"                  # GitHub Blueprint Blue for links & accents
        tertiary: "#218bff"                   # Hover blue
        highlight: "rgba(9, 105, 218, 0.08)"  # Soft blue highlight
        textHighlight: "#fae17d88"            # Warm highlighter yellow
      darkMode:
        light: "#0d1117"                      # GitHub Dark main canvas
        lightgray: "#161b22"                  # GitHub Dark elevated surface & panels
        gray: "#8b949e"                       # GitHub Dark muted text & structural rules
        darkgray: "#c9d1d9"                   # GitHub Dark primary body text
        dark: "#e6edf3"                       # GitHub Dark crisp heading white
        secondary: "#58a6ff"                  # GitHub Dark signature blue accent
        tertiary: "#79c0ff"                   # GitHub Dark hover blue
        highlight: "rgba(56, 139, 253, 0.12)" # GitHub Dark subtle blue highlight
        textHighlight: "#bb800940"

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: true
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      minEntries: 2
    layout:
      position: right
      priority: 30

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/citations"
    enabled: false
    order: 85

  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91

  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  - source: "@quartz-community/quartz-fonts"
    enabled: true

  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/explicit-publish"
    enabled: false

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 50
      rssFullHtml: false
      includeEmptyFiles: false

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: false
    options:
      colorScheme: darkMode
      width: 1200
      height: 630

  - source: "@quartz-community/cname"
    enabled: true

  - source: "@quartz-community/canvas-page"
    enabled: true

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 2
        scale: 1.15
        repelForce: 0.65
        centerForce: 0.25
        linkDistance: 42
        fontSize: 0.45
        opacityScale: 1
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.95
        repelForce: 0.55
        centerForce: 0.2
        linkDistance: 48
        fontSize: 0.35
        opacityScale: 0.85

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        "Buy me a Coffee": "https://buymeacoffee.com/silver.xoxo"
        "Join the Discord": "https://discord.gg/Mbg6T4DFzt"
        "LinkedIn": "https://linkedin.com/in/armaan-nain"
    layout:
      position: footer
      priority: 50

  - source: github:quartz-community/github-flavored-markdown
    enabled: true

  - source: "@quartz-community/recent-notes"
    enabled: false

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50

  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900

  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}