# yaml-language-server: $schema=./.quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "SILVER-XOXO"
  pageTitleSuffix: " | Exploit Developer & Vulnerability Researcher"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: silver-xoxo.github.io/blog
  ignorePatterns:
    - private
    - templates
    - .obsidian

  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: JetBrains Mono
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#0b0e14"        # Deep terminal matte black
        lightgray: "#1c212b"    # Subtle borders, search bar, card bases
        gray: "#3d4758"         # Muted dividers and graph link lines
        darkgray: "#c5cdd9"     # Clean, readable write-up prose
        dark: "#e6edf3"         # Sharp off-white headings & function names
        secondary: "#38bdf8"    # High-vis electric cyan (active links, tags, titles)
        tertiary: "#00f0ff"     # Interactive hover accents
        highlight: "rgba(56, 189, 248, 0.12)" # Memory highlight tone
        textHighlight: "#38bdf833"

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: one-dark-pro      # Clean token colors for C, x86/x64 assembly, & Python
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true

  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      minEntries: 2

  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true

  - source: "@quartz-community/graph-view"
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 2
        scale: 1.1
        repelForce: 0.6
        centerForce: 0.3
        linkDistance: 35
        fontSize: 0.5
        opacityScale: 1
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 1
        repelForce: 0.5
        centerForce: 0.2
        linkDistance: 40
        fontSize: 0.4
        opacityScale: 0.9

  - source: "@quartz-community/search"
    enabled: true
    options:
      enablePreview: true

  - source: "@quartz-community/alias-redirects"
    enabled: true